                    <button type="button" class="view-mode-btn" data-view-mode="compact">列表</button>
                </div>
            </div>
        </div>

        <div class="search-stack">
            <div class="input-wrap">
                <span class="input-icon">🔍</span>
                <input type="search"
                       id="keywordInput"
                       class="search-input"
                       placeholder="搜尋標題或內文關鍵字..."
                       autocomplete="off"
                       enterkeyhint="search"
                       aria-label="搜尋標題或內文關鍵字">
                <button type="button" id="clearKeywordBtn" class="btn-clear-input" aria-label="清除關鍵字">✕</button>
            </div>

            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input type="search"
                       id="memberInput"
                       class="search-input"
                       placeholder="篩選群友參加過的團（輸入群友名稱）..."
                       autocomplete="off"
                       enterkeyhint="search"
                       aria-label="篩選群友參加過的團">
                <button type="button" id="clearMemberBtn" class="btn-clear-input" aria-label="清除群友篩選">✕</button>
            </div>

            <div id="memberScopeCollapse" class="member-scope-collapse">
                <div class="member-scope-inner">
                    <div class="member-scope-row">
                        <span class="scope-label">參與角色：</span>
                        <button type="button" class="scope-chip active" data-scope="all">全部 (含主揪)</button>
                        <button type="button" class="scope-chip" data-scope="joiner">僅參加者</button>
                        <button type="button" class="scope-chip" data-scope="host">僅主揪</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="filter-chips-bar">
            <button type="button" class="filter-chip active" data-status="all">全部</button>
            <button type="button" class="filter-chip" data-status="圓滿結束">圓滿結束</button>
            <button type="button" class="filter-chip" data-status="提前關團">提前關團</button>
            <button type="button" class="filter-chip sort-chip" id="sortToggleBtn">最新 ▾</button>
        </div>

        <div id="activeFilterCollapse" class="active-filter-collapse">
            <div class="active-filter-inner">
                <div class="active-filter-bar">
                    <span>已套用篩選條件</span>
                    <button type="button" id="clearAllFiltersBtn" class="btn-reset-filters">清除篩選 ✕</button>
                </div>
            </div>
        </div>
    </header>

    <div class="workspace-grid">
        <div class="list-pane">
            <!-- 現代化載入骨架屏 -->
            <div id="loadingSkeleton" aria-live="polite">
                <div class="loading-banner">
                    <div class="spinner"></div>
                    <span>正在載入揪團大事記...</span>
                </div>
                <div class="skeleton-card">
                    <div class="sk-row-between"><div class="sk-line sk-pill"></div><div class="sk-line sk-badge"></div></div>
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-text-1"></div>
                    <div class="sk-line sk-text-2"></div>
                    <div class="sk-line sk-footer"></div>
                </div>
                <div class="skeleton-card">
                    <div class="sk-row-between"><div class="sk-line sk-pill"></div><div class="sk-line sk-badge"></div></div>
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-text-1"></div>
                    <div class="sk-line sk-text-2"></div>
                    <div class="sk-line sk-footer"></div>
                </div>
                <div class="skeleton-card">
                    <div class="sk-row-between"><div class="sk-line sk-pill"></div><div class="sk-line sk-badge"></div></div>
                    <div class="sk-line sk-title"></div>
                    <div class="sk-line sk-text-1"></div>
                    <div class="sk-line sk-text-2"></div>
                    <div class="sk-line sk-footer"></div>
                </div>
            </div>

            <main id="historyList"></main>

            <div id="listFooter"></div>

        <!-- 電腦雙欄右側即時閱覽窗格 -->
        <aside id="desktopDetailPane" class="desktop-detail-pane" aria-label="揪團詳情閱覽窗格">

                <div class="sk-row-between"><div class="sk-line sk-pill"></div><div class="sk-line sk-badge"></div></div>
                <div class="sk-line sk-title"></div>
                <div class="sk-line sk-text-1"></div>
                <div class="sk-line sk-text-1"></div>
                <div class="sk-line sk-text-2"></div>
            </div>

            <div id="paneEmpty" class="pane-empty" style="display: none;">
                <div class="empty-icon">📖</div>
                <div class="empty-title">沒有可閱覽的揪團詳情</div>
                <div class="empty-desc">請調整左側篩選條件，或點擊清單中的揪團項目。</div>
            </div>

            <div id="paneContentWrap" style="display: none;">
                <div class="pane-header">
                    <div class="sheet-header-meta">
                        <span id="paneTopTime" class="time-badge"></span>
                        <span id="paneStatusBadge" class="status-badge"></span>
                    </div>
                    <span class="pane-kbd-hint">可用 ↑ ↓ 鍵切換</span>
                </div>

                <div id="paneBody" class="pane-body">
                    <h2 id="paneTitle" class="detail-title"></h2>

                    <div class="detail-info-box">
                        <div class="detail-info-row">
                            <span class="detail-info-lbl">活動時間</span>
                            <span id="paneActivityTime" class="detail-info-val"></span>
                        </div>
                        <div class="detail-info-row" id="paneHostDateRow">
                            <span class="detail-info-lbl">發起日期</span>
                            <span id="paneHostDate" class="detail-info-val"></span>
                        </div>
                    </div>

                    <div id="paneLocationCard" class="detail-location-card" style="display: none;">
                        <div class="detail-loc-text">
                            <div class="detail-loc-name">📍 <span id="paneLocName"></span></div>
                            <div id="paneLocAddr" class="detail-loc-addr"></div>
                        </div>
                        <a id="paneMapBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-map-link">地圖 ↗</a>
                    </div>

                    <div>
                        <div class="detail-section-label"><span>📝 活動內容</span></div>
                        <div id="paneContent" class="detail-content-box"></div>
                    </div>

                    <div>
                        <div class="detail-section-label">
                            <span id="paneJoinerCount">👥 參與名單</span>
                            <span class="detail-section-hint">點擊名字可篩選該群友</span>
                        </div>
                        <div id="paneMemberChips" class="member-chips-wrap"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</div>

<button type="button" id="backToTopBtn" class="btn-back-top" aria-label="回到頂部">↑ 頂部</button>

<!-- 揪團詳情 Bottom Sheet / Modal -->
<div id="detailOverlay" class="detail-overlay" onclick="if(event.target===this) closeDetailModal()">
    <div id="detailSheet" class="detail-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div id="sheetDragArea" class="sheet-drag-area">
            <div class="sheet-handle"></div>
            <div class="sheet-header-row">
                <div class="sheet-header-meta">
                    <span id="detailTopTime" class="time-badge"></span>
                    <span id="detailStatusBadge" class="status-badge"></span>
                </div>
                <button type="button" class="sheet-close-btn" onclick="closeDetailModal()" aria-label="關閉詳情">✕</button>
            </div>
        </div>

        <div id="detailBody" class="detail-body">
            <h2 id="detailTitle" class="detail-title"></h2>

            <div class="detail-info-box">
                <div class="detail-info-row">
                    <span class="detail-info-lbl">活動時間</span>
                    <span id="detailActivityTime" class="detail-info-val"></span>
                </div>
                <div class="detail-info-row" id="detailHostDateRow">
                    <span class="detail-info-lbl">發起日期</span>
                    <span id="detailHostDate" class="detail-info-val"></span>
                </div>
            </div>

            <div id="detailLocationCard" class="detail-location-card" style="display: none;">
                <div class="detail-loc-text">
                    <div class="detail-loc-name">📍 <span id="detailLocName"></span></div>
                    <div id="detailLocAddr" class="detail-loc-addr"></div>
                </div>
                <a id="detailMapBtn" href="#" target="_blank" rel="noopener noreferrer" class="btn-map-link">地圖 ↗</a>
            </div>

            <div>
                <div class="detail-section-label"><span>📝 活動內容</span></div>
                <div id="detailContent" class="detail-content-box"></div>
            </div>

            <div>
                <div class="detail-section-label">
                    <span id="detailJoinerCount">👥 參與名單</span>
                    <span class="detail-section-hint">點擊名字可篩選該群友</span>
                </div>
                <div id="detailMemberChips" class="member-chips-wrap"></div>
            </div>
        </div>
    </div>
</div>
